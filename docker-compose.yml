version: '3.8'

services:
  mongo:
    image: mongo
    container_name: taskmanager-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  app:
    build: .
    container_name: taskmanager-app
    ports:
      - "3000:5000"
    depends_on:
      - mongo
    environment:
      - MONGO_URI=mongodb://mongo:27017/taskmanager
      - PORT=5000

volumes:
  mongo-data:
